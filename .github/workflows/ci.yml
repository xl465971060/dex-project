name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test -vvv

  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: perpdex
          POSTGRES_PASSWORD: perpdex
          POSTGRES_DB: perpdex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perpdex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://perpdex:perpdex@localhost:5432/perpdex
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @perpdex/api db:generate
      # 合约单独跑，这里排除掉
      - run: pnpm turbo build test typecheck --filter=!@perpdex/contracts
